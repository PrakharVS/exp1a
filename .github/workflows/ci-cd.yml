name: EXP1 CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/exp1-prakhar:v2 .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/exp1-prakhar:v2

    - name: Update manifest repo
      run: |
        git clone https://github.com/PrakharVS/exp1b.git
        cd exp1b

        # Update image in manifest.yml
        sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/exp1-prakhar:v2|" manifest.yml

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add .
        git commit -m "Update image"
        git push https://${{ secrets.GITHUB_TOKEN }}@github.com/PrakharVS/exp1b.git
